name: Build WHISLIST HASIM APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract fixed project ZIP
        run: |
          ZIP_FILE="WHISLIST_HASIM_PROJECT_FIXED.zip"
          test -f "$ZIP_FILE" || { echo "ZIP tidak ditemukan: $ZIP_FILE"; exit 1; }
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted
          PROJECT_DIR="$(find extracted -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) | head -n 1 | xargs dirname)"
          test -n "$PROJECT_DIR" || { echo "Folder proyek Android tidak ditemukan"; exit 1; }
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER" || { echo "sdkmanager tidak ditemukan"; exit 1; }
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set Java and Kotlin targets to 17
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle")
          s = p.read_text()

          s = s.replace(
              "sourceCompatibility JavaVersion.VERSION_1_8",
              "sourceCompatibility JavaVersion.VERSION_17"
          )
          s = s.replace(
              "targetCompatibility JavaVersion.VERSION_1_8",
              "targetCompatibility JavaVersion.VERSION_17"
          )

          if "kotlinOptions" not in s:
              s += """

          android {
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          """
          else:
              s = s.replace(
                  "jvmTarget = '1.8'",
                  "jvmTarget = '17'"
              )

          p.write_text(s)
          print("Konfigurasi target Java/Kotlin disesuaikan ke 17")
          PY

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WHISLIST-HASIM-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
